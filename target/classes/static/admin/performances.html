<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Player performances  |  Tashkeela Admin</title><link rel="stylesheet" href="/css/style.css"></head><body class="app-page admin-page"><header id="appHeader"></header><main class="app-main"><section class="page-heading"><div><p class="eyebrow">MATCH DATA</p><h1>Player performances</h1><p class="muted">Record player statistics after each match for forecasts and analysis.</p></div></section><section class="panel section-panel admin-form-panel"><form id="performanceForm" class="form-grid"><label>Match<select id="performanceMatch" required></select></label><label>Player<select id="performancePlayer" required></select></label><label>Goals<input name="goals" type="number" min="0" value="0" required></label><label>Assists<input name="assists" type="number" min="0" value="0" required></label><label>Minutes played<input name="minutesPlayed" type="number" min="0" max="130" value="0" required></label><label>Pass accuracy (%)<input name="passAccuracy" type="number" min="0" max="100" step="0.1" value="0"></label><label>Yellow cards<input name="yellowCards" type="number" min="0" value="0"></label><label>Red cards<input name="redCards" type="number" min="0" value="0"></label><label class="check-label"><input name="cleanSheet" type="checkbox"> Clean sheet</label><label class="check-label"><input name="manOfMatch" type="checkbox"> Player of the match</label><button class="button button-primary" type="submit">Save performance</button></form></section><p id="adminNotice" class="notice" role="status" aria-live="polite" hidden></p></main><script src="/js/app.js"></script></body></html>
