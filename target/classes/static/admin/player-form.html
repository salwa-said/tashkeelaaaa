<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Add player  |  Tashkeela Admin</title><link rel="stylesheet" href="/css/style.css"></head><body class="app-page admin-page"><header id="appHeader"></header><main class="app-main">
<section class="page-heading"><div><p class="eyebrow">PLAYER MARKET</p><h1 id="adminFormTitle">Add player</h1><p class="muted">Enter the player details for the fantasy market.</p></div><a class="button button-outline" href="/admin/players.html">Back to players</a></section>
<section class="panel section-panel admin-form-panel"><form id="adminEntityForm" class="form-grid"><label>Player name<input name="name" required></label><label>Position<select name="position" required><option value="">Choose position</option><option>Goalkeeper</option><option>Defender</option><option>Midfielder</option><option>Forward</option></select></label><label>Age<input name="age" type="number" min="15" max="60" required></label><label>Price (M)<input name="price" type="number" min="0" step="0.1" required></label><label>Overall rating<input name="overallRating" type="number" min="0" max="100" step="0.1" required></label><label>Nationality<input name="nationality"></label><label>Image URL<input name="image" type="url"></label><label>Club<select name="clubId" id="playerClubSelect"><option value="">No club</option></select></label><button id="adminFormSubmit" class="button button-primary" type="submit">Save player</button></form></section>
<p id="adminNotice" class="notice" role="status" aria-live="polite" hidden></p></main><script src="/js/app.js"></script></body></html>
