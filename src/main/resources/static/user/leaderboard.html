<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Leaderboard  |  Tashkeela</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body class="app-page leaderboard-page">
<header id="appHeader"></header>
<main class="app-main">
<section class="page-heading leaderboard-heading"><div><p class="eyebrow">THE LEAGUE TABLE</p><h1>Champions leaderboard</h1><p class="muted">Managers compete on total fantasy points. Keep climbing the table.</p></div><span class="leaderboard-season-mark"><span>SEASON</span><strong>01</strong></span></section>
<section id="championBoard" class="champion-board" aria-label="Top three fantasy teams"><p class="muted">Loading the title race...</p></section>
<section id="leaderboardTablePanel" class="panel section-panel leaderboard-table-panel" hidden><div class="section-heading"><div><p class="eyebrow">FULL TABLE</p><h2>League standings</h2></div><span id="leaderboardTeamCount" class="leaderboard-count"></span></div><div class="table-wrap"><table class="leaderboard-table"><thead><tr><th>Rank</th><th>Manager</th><th>Fantasy team</th><th>Points</th><th>Rating</th></tr></thead><tbody id="leaderboardRows"></tbody></table></div></section>
</main>
<script src="/js/app.js"></script>
</body>
</html>
