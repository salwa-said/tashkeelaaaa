<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Player performances | Tashkeela Admin</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="app-page admin-page">
<header id="appHeader"></header>
<main class="app-main">
    <section class="page-heading">
        <div><p class="eyebrow">MATCH DATA</p><h1>Player performances</h1><p class="muted">Record match stats and AI ratings to update fantasy points automatically.</p></div>
    </section>
    <section class="panel section-panel admin-form-panel">
        <form id="performanceForm" class="form-grid">
            <label>Match<select id="performanceMatch" required></select></label>
            <label id="existingPlayerControl">Player<select id="performancePlayer" required></select></label>
            <button id="showNewPlayer" class="button button-quiet" type="button">+ Add a new player</button>
            <div id="newPlayerFields" class="form-grid form-wide" hidden>
                <label>Player name<input name="newPlayerName" maxlength="100" required disabled></label>
                <label>Position<select name="newPlayerPosition" required disabled><option value="">Choose position</option><option>Goalkeeper</option><option>Defender</option><option>Midfielder</option><option>Forward</option></select></label>
                <label>Age<input name="newPlayerAge" type="number" min="15" max="60" value="20" required disabled></label>
                <label>Price (M)<input name="newPlayerPrice" type="number" min="0" step="0.1" value="1" required disabled></label>
                <label>Overall rating<input name="newPlayerRating" type="number" min="0" max="100" step="0.1" value="50" required disabled></label>
                <label>Club<select name="newPlayerClub" required disabled></select></label>
                <label>Nationality<input name="newPlayerNationality" maxlength="80" disabled></label>
                <label>Image URL<input name="newPlayerImage" type="url" disabled></label>
            </div>
            <label>Goals<input name="goals" type="number" min="0" max="30" step="1" value="0" required></label>
            <label>Assists<input name="assists" type="number" min="0" max="30" step="1" value="0" required></label>
            <label>Minutes played<input name="minutesPlayed" type="number" min="0" max="130" value="0" required></label>
            <label>Pass accuracy (%)<input name="passAccuracy" type="number" min="0" max="100" step="0.1" value="0" required></label>
            <label>AI rating (0-10)<input name="aiRating" type="number" min="0" max="10" step="0.1" value="0" required></label>
            <label>Yellow cards<input name="yellowCards" type="number" min="0" max="10" step="1" value="0" required></label>
            <label>Red cards<input name="redCards" type="number" min="0" max="5" step="1" value="0" required></label>
            <label class="check-label"><input name="cleanSheet" type="checkbox"> Clean sheet</label>
            <label class="check-label"><input name="manOfMatch" type="checkbox"> Player of the match</label>
            <button class="button button-primary" type="submit">Save player and performance</button>
        </form>
    </section>
    <p id="adminNotice" class="notice" role="status" aria-live="polite" hidden></p>
</main>
<script src="/js/app.js"></script>
</body>
</html>
