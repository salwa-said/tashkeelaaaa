<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Add club  |  Tashkeela Admin</title><link rel="stylesheet" href="/css/style.css"></head><body class="app-page admin-page"><header id="appHeader"></header><main class="app-main">
<section class="page-heading"><div><p class="eyebrow">LEAGUE DIRECTORY</p><h1 id="adminFormTitle">Add club</h1><p class="muted">Enter the club details for the league directory.</p></div><a class="button button-outline" href="/admin/clubs.html">Back to clubs</a></section>
<section class="panel section-panel admin-form-panel"><form id="adminEntityForm" class="form-grid"><label>Club name<input name="clubName" required></label><label>Short name<input name="shortName"></label><label>City<input name="city"></label><label>Trophies<input name="trophies" type="number" min="0" value="0"></label><label>Logo URL<input name="logo" type="url"></label><label class="form-wide">Description<textarea name="description"></textarea></label><button id="adminFormSubmit" class="button button-primary" type="submit">Save club</button></form></section>
<p id="adminNotice" class="notice" role="status" aria-live="polite" hidden></p></main><script src="/js/app.js"></script></body></html>
