<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Match statistics  |  Tashkeela Admin</title><link rel="stylesheet" href="/css/style.css"></head><body class="app-page admin-page"><header id="appHeader"></header><main class="app-main"><section class="page-heading"><div><p class="eyebrow">MATCH DATA</p><h1>Match statistics</h1><p class="muted">Enter team statistics after a match to enable match reports.</p></div></section><section class="panel section-panel admin-form-panel"><form id="matchStatisticsForm" class="form-grid"><label class="form-wide">Match<select id="statisticsMatch" required></select></label><label>Home possession (%)<input name="possessionHome" type="number" min="0" max="100" value="50"></label><label>Away possession (%)<input name="possessionAway" type="number" min="0" max="100" value="50"></label><label>Home shots<input name="shotsHome" type="number" min="0" value="0"></label><label>Away shots<input name="shotsAway" type="number" min="0" value="0"></label><label>Home shots on target<input name="shotsOnTargetHome" type="number" min="0" value="0"></label><label>Away shots on target<input name="shotsOnTargetAway" type="number" min="0" value="0"></label><label>Home corners<input name="cornersHome" type="number" min="0" value="0"></label><label>Away corners<input name="cornersAway" type="number" min="0" value="0"></label><label>Home fouls<input name="foulsHome" type="number" min="0" value="0"></label><label>Away fouls<input name="foulsAway" type="number" min="0" value="0"></label><label>Home yellow cards<input name="yellowCardsHome" type="number" min="0" value="0"></label><label>Away yellow cards<input name="yellowCardsAway" type="number" min="0" value="0"></label><label>Home red cards<input name="redCardsHome" type="number" min="0" value="0"></label><label>Away red cards<input name="redCardsAway" type="number" min="0" value="0"></label><button class="button button-primary" type="submit">Save statistics</button></form></section><p id="adminNotice" class="notice" role="status" aria-live="polite" hidden></p></main><script src="/js/app.js"></script></body></html>
