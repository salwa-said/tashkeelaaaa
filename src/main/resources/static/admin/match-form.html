<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Add match  |  Tashkeela Admin</title><link rel="stylesheet" href="/css/style.css"></head><body class="app-page admin-page"><header id="appHeader"></header><main class="app-main">
<section class="page-heading"><div><p class="eyebrow">FIXTURES</p><h1 id="adminFormTitle">Add match</h1><p class="muted">Set the clubs, kick-off time, and match details.</p></div><a class="button button-outline" href="/admin/matches.html">Back to matches</a></section>
<section class="panel section-panel admin-form-panel"><form id="adminEntityForm" class="form-grid"><label>Home club<select name="homeClubId" id="homeClubSelect" required><option value="">Choose home club</option></select></label><label>Away club<select name="awayClubId" id="awayClubSelect" required><option value="">Choose away club</option></select></label><label>Date and time<input name="matchDate" type="datetime-local" required></label><label>Venue<input name="venue"></label><label>Status<select name="status"><option>SCHEDULED</option><option>LIVE</option><option>COMPLETED</option><option>POSTPONED</option></select></label><label class="match-score-field" hidden>Home score<input name="homeScore" type="number" min="0" value="0"></label><label class="match-score-field" hidden>Away score<input name="awayScore" type="number" min="0" value="0"></label><button id="adminFormSubmit" class="button button-primary" type="submit">Save match</button></form></section>
<p id="adminNotice" class="notice" role="status" aria-live="polite" hidden></p></main><script src="/js/app.js"></script></body></html>
