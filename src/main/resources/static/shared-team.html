<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Shared squad | Tashkeela</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="app-page squad-page">
<header id="appHeader"></header>
<main class="app-main">
    <section class="page-heading"><div><p class="eyebrow">SHARED FANTASY TEAM</p><h1 id="sharedTeamTitle">Shared squad</h1><p id="sharedTeamFormation" class="muted">Loading squad…</p></div></section>
    <section id="sharedTeamSummary" class="stats-grid" hidden>
        <article class="panel metric"><span>Fantasy points</span><strong id="sharedTeamPoints">-</strong></article>
        <article class="panel metric"><span>Team rating</span><strong id="sharedTeamRating">-</strong></article>
        <article class="panel metric"><span>Players selected</span><strong id="sharedTeamCount">-</strong></article>
    </section>
    <section class="panel section-panel"><div id="sharedTeamPlayers" class="stack-list"></div></section>
</main>
<script src="/js/app.js"></script>
</body>
</html>
