<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account  |  Tashkeela</title><link rel="stylesheet" href="/css/style.css"></head><body class="auth-page"><main class="auth-layout"><section class="auth-brand"><img src="/assets/images/logo.png" alt="Tashkeela"><p class="eyebrow">OMAN FANTASY FOOTBALL</p><h1>Start your<br>fantasy season.</h1><p>Create your account and build a squad from the league player market.</p></section><section class="auth-card"><p class="eyebrow">JOIN THE LEAGUE</p><h2>Create account</h2><form onsubmit="event.preventDefault();register()"><label>Full name<input id="fullName" autocomplete="name" required></label><label>Email<input id="email" type="email" autocomplete="email" required></label><label>Password<input id="password" type="password" autocomplete="new-password" required></label><label>Confirm password<input id="confirmPassword" type="password" autocomplete="new-password" required></label><label class="show-password"><input id="showPassword" type="checkbox" onchange="togglePasswords()"> Show passwords</label><button class="button button-primary auth-cta" type="submit">Create account</button></form><p id="authMessage" class="auth-message" hidden aria-live="polite"></p><p class="fine-print">Already registered? <a class="text-link" href="/login.html">Sign in</a></p></section></main><script src="/js/app.js"></script></body></html>
