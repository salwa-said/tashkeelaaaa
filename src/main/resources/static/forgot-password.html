<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset password  |  Tashkeela</title><link rel="stylesheet" href="/css/style.css"></head><body class="auth-page"><main class="auth-layout"><section class="auth-brand"><img src="/assets/images/logo.png" alt="Tashkeela"><p class="eyebrow">ACCOUNT RECOVERY</p><h1>Back in the<br>game.</h1><p>Request a code, then choose a new password.</p></section><section class="auth-card"><p class="eyebrow">RESET PASSWORD</p><h2>Account recovery</h2><label>Email<input id="resetEmail" type="email" autocomplete="email" required></label><button class="button button-outline auth-cta" onclick="sendResetOTP()">Send verification code</button><label>Verification code<input id="resetOTP" inputmode="numeric"></label><label>New password<input id="newPassword" type="password" autocomplete="new-password"></label><button class="button button-primary auth-cta" onclick="resetPassword()">Save new password</button><p id="authMessage" class="auth-message" hidden aria-live="polite"></p><p class="fine-print"><a class="text-link" href="/login.html">Back to sign in</a></p></section></main><script src="/js/app.js"></script></body></html>
